name: Native audit - private package boundaries
on:
  push:
    branches: [main]
    paths:
      - 'tools/audit_private_paths.py'
      - '.github/workflows/windows-audit-package.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package-boundaries:
    runs-on: windows-2022
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Real Windows junction and Git ignore adversarial controls (only fake bytes)
        run: python tools/audit_private_paths.py
