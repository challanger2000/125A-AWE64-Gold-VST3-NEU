name: Adversarial regression - native and oracle controls
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/windows-current-adversarial-audit.yml'
      - 'src/**'
      - 'integration/**'
      - 'tests/adversarial-current/**'
      - 'tests/WindowsCheezoidsSweep.py'
      - 'tests/WindowsGuestDemandClockSmoke.py'
      - 'tests/WindowsRunVst3HostPcmSmoke.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portable-oracles:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Build exact portable parser and run independent negative controls
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          cmake -S . -B build-audit -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          cmake --build build-audit --target AuditSf2PreflightTest --parallel 2
          python tests/adversarial-current/probes.py build-audit/AuditSf2PreflightTest
  windows-real-vst3:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          persist-credentials: false
      - uses: microsoft/setup-msbuild@v2
      - name: Confirm original DOSBox-X SHA
        shell: pwsh
        run: |
          $sha=(git -C third_party/dosbox-x-AWE32 rev-parse HEAD).Trim()
          if ($sha -ne 'f3a95b9f19a7f9863295e6481f271cf04733c635') { throw "Unexpected upstream SHA $sha" }
      - name: Patch only GitHub runner working tree
        shell: pwsh
        run: |
          python integration/patch_dosbox_runtime.py third_party/dosbox-x-AWE32
          if ($LASTEXITCODE -ne 0) { throw "Source patch failed" }
      - name: Check private Creative-only setup script PowerShell syntax without original files
        shell: pwsh
        run: |
          $t = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'tools/Run-Private-Creative-AWE-Test.ps1').Path,[ref]$t,[ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) { throw ('Private staging PowerShell syntax error: ' + ($parseErrors | Out-String)) }
      - name: Restore compiled OPEN-SOURCE DOSBox-X SDL2 DLL cache (NO owner ROM/SF2/Creative)
        id: original-dosbox-cache
        uses: actions/cache/restore@v4
        with:
          path: third_party/dosbox-x-AWE32/bin/x64/Release SDL2/AWE64DOSBoxRuntime.dll
          key: awe64-original-sdl2-msvc-2022-f3a95b9-${{ hashFiles('integration/patch_dosbox_runtime.py','research/p165-control-port/VoiceOverlay.hpp') }}
      - name: Build in-process x64 DOSBox-X-AWE32 DLL
        if: steps.original-dosbox-cache.outputs.cache-hit != 'true'
        shell: pwsh
        working-directory: third_party/dosbox-x-AWE32
        run: |
          msbuild vs/dosbox-x.sln -t:dosbox-x:Rebuild '-p:Configuration=Release SDL2' -p:Platform=x64 -p:PostBuildEventUseInBuild=false -m:4
          if ($LASTEXITCODE -ne 0) { throw "DOSBox runtime DLL compilation failed" }
          if (-not (Test-Path 'bin/x64/Release SDL2/AWE64DOSBoxRuntime.dll')) { throw "Runtime DLL not found" }
      - name: Save compiled OPEN-SOURCE DOSBox-X SDL2 DLL after successful build
        if: steps.original-dosbox-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: third_party/dosbox-x-AWE32/bin/x64/Release SDL2/AWE64DOSBoxRuntime.dll
          key: awe64-original-sdl2-msvc-2022-f3a95b9-${{ hashFiles('integration/patch_dosbox_runtime.py','research/p165-control-port/VoiceOverlay.hpp') }}
      - name: Compile VST3 host and stage original internal DOSBox-X runtime DLL
        shell: pwsh
        run: |
          git clone --depth 1 --branch v3.7.12_build_20 --recurse-submodules --shallow-submodules https://github.com/steinbergmedia/vst3sdk.git "$env:RUNNER_TEMP\vst3sdk"
          if ($LASTEXITCODE -ne 0) { throw "VST3 SDK acquisition failed" }
          Copy-Item tests/adversarial-current/NativeHost.cpp tests/WindowsVst3HostPcmSmoke.cpp -Force
          cmake -S . -B build-vst3 -G "Visual Studio 17 2022" -A x64 -DAWE64_BUILD_VST3_DEV=ON -DAWE64_VST3SDK="$env:RUNNER_TEMP\vst3sdk" -DBUILD_TESTING=OFF
          if ($LASTEXITCODE -ne 0) { throw "VST3 configuration failed" }
          cmake --build build-vst3 --config Release --target AWE64GoldDOSBoxDev awe64_vst3_host_pcm_smoke --parallel 2
          if ($LASTEXITCODE -ne 0) { throw "VST3 Windows build failed" }
          $bundle='build-vst3/VST3/Release/125A AWE64 Gold.vst3/Contents/x86_64-win'
          $native='third_party/dosbox-x-AWE32/bin/x64/Release SDL2/AWE64DOSBoxRuntime.dll'
          if (-not (Test-Path $native)) { throw "Original DOSBox DLL not built" }
          if (-not (Test-Path (Join-Path $bundle '125A AWE64 Gold.vst3'))) { throw "VST3 host binary missing" }
          Copy-Item $native (Join-Path $bundle 'Engine.dll')
          if (-not (Test-Path (Join-Path $bundle 'Engine.dll'))) { throw "In-bundle runtime DLL missing" }
          Write-Output "Single VST3 bundle contains real original DOSBox-X-AWE32 DLL; no private Creative ROM/DEMO/SF2, no real playback proof"
      - name: Build synthetic ABI recorder in disposable tree
        shell: pwsh
        run: |
          Copy-Item tests/adversarial-current/FaultDLL.cpp tools/audit-native-runtime/fault_dll.cpp -Force
          cmake -S tools/audit-native-runtime -B build-audit-shim -G "Visual Studio 17 2022" -A x64
          if ($LASTEXITCODE -ne 0) { throw 'Shim configure failed' }
          cmake --build build-audit-shim --config Release --target AWE64DOSBoxRuntime --parallel 2
          if ($LASTEXITCODE -ne 0) { throw 'Shim build failed' }
      - name: Actual VST3 default offline render, accepted bank identity and MIDI ordering
        shell: pwsh
        timeout-minutes: 5
        run: |
          $bundle=(Resolve-Path 'build-vst3/VST3/Release/125A AWE64 Gold.vst3').Path
          python tests/MakeSyntheticDemoExe.py --bundle $bundle
          if ($LASTEXITCODE -ne 0) { throw 'Synthetic fixture staging failed' }
          $fixtures=Join-Path $env:RUNNER_TEMP 'current-audit-banks'
          @'
          import runpy,sys
          sys.argv=['tests/MakeAuditSf2Cases.py',sys.argv[1]]
          f=runpy.run_path(sys.argv[0])
          f['write']('program17',lambda l:f['mutate'](l[b'pdta'],b'phdr',20,'<H',17))
          '@ | Set-Content -Encoding utf8 "$env:RUNNER_TEMP\current-fixtures.py"
          python "$env:RUNNER_TEMP\current-fixtures.py" $fixtures
          if ($LASTEXITCODE -ne 0) { throw 'SF2 fixtures failed' }
          $plugin=Join-Path $bundle 'Contents/x86_64-win/125A AWE64 Gold.vst3'
          $dll=Join-Path $bundle 'Contents/x86_64-win/Engine.dll'
          $exe=(Get-ChildItem build-vst3 -Recurse -Filter awe64_vst3_host_pcm_smoke.exe | Select-Object -First 1).FullName
          $env:SDL_AUDIODRIVER='dummy'
          $env:AWE64_TEST_PERFORMANCE='1'
          Remove-Item Env:AWE64_TEST_HOST_DEMAND_CLOCK -ErrorAction SilentlyContinue
          $bank=Join-Path $fixtures 'valid.sf2'
          $shim=(Resolve-Path 'build-audit-shim/Release/Engine.dll').Path
          @'
          import os, pathlib, shutil, subprocess, sys
          exe, plugin, bank, dll, shim = sys.argv[1:]
          failed = []
          def run(mode, env, timeout):
              print("ADVERSARIAL_CASE_BEGIN", mode, flush=True)
              try:
                  result = subprocess.run([exe, plugin, mode, bank],
                      env=env, capture_output=True, text=True,
                      errors="replace", timeout=timeout)
              except subprocess.TimeoutExpired as e:
                  print("ADVERSARIAL_CASE_TIMEOUT", mode, e.stdout, e.stderr, flush=True)
                  failed.append(mode + "=timeout")
                  return
              print(result.stdout, flush=True)
              print(result.stderr, flush=True)
              markers = {
                  "early": ("AUDIT_A09_EARLY_NOTE PASS", 1),
                  "offline": ("AUDIT_DEFAULT_OFFLINE PASS", 1),
                  "bankreplace": ("AUDIT_ACCEPTED_BANK_IDENTITY PASS", 1),
                  "eventorder": ("AUDIT_DEFAULT_MIDI_ORDER PASS", 1),
                  "invalidblock": ("AUDIT_INVALID_BLOCK_ATOMIC_REJECT PASS", 3),
                  "handover": ("AUDIT_HANDOVER_OLD_STOP_UNLOCKED PASS", 1),
              }
              marker, count = markers[mode]
              valid = result.stdout.count(marker) == count
              if mode == "eventorder":
                  valid = valid and result.stdout.count("AUDIT_PROGRAM_ORDER PASS") == 1
              if mode == "invalidblock":
                  valid = valid and result.stdout.count("AUDIT_INVALID_BLOCK_RECOVERY PASS") == 1
              if mode != "bankreplace":
                  valid = valid and result.stdout.count(
                      "AUDIT_NATIVE_RUNTIME_EXECUTED mode=" + mode + " failures=0 nonfinite_or_unwritten=0") == 1
              if result.returncode or not valid:
                  failed.append(mode + "=" + str(result.returncode))
          # A failed startup case remains FAIL but cannot suppress unrelated
          # bank identity or deterministic ABI cases. Each child is bounded.
          for mode in ("early", "offline", "bankreplace"):
              run(mode, os.environ.copy(), 75 if mode == "early" else 45)
          shutil.copyfile(shim, dll)
          for mode in ("eventorder", "invalidblock", "handover"):
              env = os.environ.copy()
              env["AWE64_AUDIT_SHIM_MODE"] = "handover" if mode == "handover" else "eventorder"
              directory = pathlib.Path(env["RUNNER_TEMP"]) / ("current-audit-" + mode)
              directory.mkdir()
              env["AWE64_AUDIT_SHIM_DIR"] = str(directory)
              run(mode, env, 35)
          print("ADVERSARIAL_NATIVE_FAILURES=" + repr(failed), flush=True)
          sys.exit(bool(failed))
          '@ | Set-Content -Encoding utf8 "$env:RUNNER_TEMP\current-adversarial.py"
          python "$env:RUNNER_TEMP\current-adversarial.py" $exe $plugin $bank $dll $shim
          if ($LASTEXITCODE -ne 0) { throw 'At least one independent adversarial case failed or lacked evidence' }
