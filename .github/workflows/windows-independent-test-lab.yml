name: Independent Test Lab - verified AWE64 baseline
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/windows-independent-test-lab.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  independent-windows:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: '0ff08116701efd831b9fca00970f8b059ae9b9af'
          submodules: true
          persist-credentials: false
      - uses: microsoft/setup-msbuild@v2
      - name: Confirm original DOSBox-X SHA
        shell: pwsh
        run: |
          $sha=(git -C third_party/dosbox-x-AWE32 rev-parse HEAD).Trim()
          if ($sha -ne 'f3a95b9f19a7f9863295e6481f271cf04733c635') { throw "Unexpected upstream SHA $sha" }
      - name: Patch only GitHub runner working tree
        shell: pwsh
        run: |
          python integration/patch_dosbox_runtime.py third_party/dosbox-x-AWE32
          if ($LASTEXITCODE -ne 0) { throw "Source patch failed" }
      - name: Check private Creative-only setup script PowerShell syntax without original files
        shell: pwsh
        run: |
          $t = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'tools/Run-Private-Creative-AWE-Test.ps1').Path,[ref]$t,[ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) { throw ('Private staging PowerShell syntax error: ' + ($parseErrors | Out-String)) }
      - name: Restore compiled OPEN-SOURCE DOSBox-X SDL2 DLL cache (NO owner ROM/SF2/Creative)
        id: original-dosbox-cache
        uses: actions/cache/restore@v4
        with:
          path: third_party/dosbox-x-AWE32/bin/x64/Release SDL2/AWE64DOSBoxRuntime.dll
          key: awe64-original-sdl2-msvc-2022-f3a95b9-${{ hashFiles('integration/patch_dosbox_runtime.py','research/p165-control-port/VoiceOverlay.hpp') }}
      - name: Build in-process x64 DOSBox-X-AWE32 DLL
        if: steps.original-dosbox-cache.outputs.cache-hit != 'true'
        shell: pwsh
        working-directory: third_party/dosbox-x-AWE32
        run: |
          msbuild vs/dosbox-x.sln -t:dosbox-x:Rebuild '-p:Configuration=Release SDL2' -p:Platform=x64 -p:PostBuildEventUseInBuild=false -m:4
          if ($LASTEXITCODE -ne 0) { throw "DOSBox runtime DLL compilation failed" }
          if (-not (Test-Path 'bin/x64/Release SDL2/AWE64DOSBoxRuntime.dll')) { throw "Runtime DLL not found" }
      - name: Save compiled OPEN-SOURCE DOSBox-X SDL2 DLL after successful build
        if: steps.original-dosbox-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: third_party/dosbox-x-AWE32/bin/x64/Release SDL2/AWE64DOSBoxRuntime.dll
          key: awe64-original-sdl2-msvc-2022-f3a95b9-${{ hashFiles('integration/patch_dosbox_runtime.py','research/p165-control-port/VoiceOverlay.hpp') }}
      - name: Compile VST3 host and stage original internal DOSBox-X runtime DLL
        shell: pwsh
        run: |
          git clone --depth 1 --branch v3.7.12_build_20 --recurse-submodules --shallow-submodules https://github.com/steinbergmedia/vst3sdk.git "$env:RUNNER_TEMP\vst3sdk"
          if ($LASTEXITCODE -ne 0) { throw "VST3 SDK acquisition failed" }
          cmake -S . -B build-vst3 -G "Visual Studio 17 2022" -A x64 -DAWE64_BUILD_VST3_DEV=ON -DAWE64_VST3SDK="$env:RUNNER_TEMP\vst3sdk" -DBUILD_TESTING=OFF
          if ($LASTEXITCODE -ne 0) { throw "VST3 configuration failed" }
          cmake --build build-vst3 --config Release --target AWE64GoldDOSBoxDev --parallel 2
          if ($LASTEXITCODE -ne 0) { throw "VST3 Windows build failed" }
          $bundle='build-vst3/VST3/Release/AWE64GoldDOSBoxDev.vst3/Contents/x86_64-win'
          $native='third_party/dosbox-x-AWE32/bin/x64/Release SDL2/AWE64DOSBoxRuntime.dll'
          if (-not (Test-Path $native)) { throw "Original DOSBox DLL not built" }
          if (-not (Test-Path (Join-Path $bundle 'AWE64GoldDOSBoxDev.vst3'))) { throw "VST3 host binary missing" }
          Copy-Item $native (Join-Path $bundle 'AWE64DOSBoxRuntime.dll')
          if (-not (Test-Path (Join-Path $bundle 'AWE64DOSBoxRuntime.dll'))) { throw "In-bundle runtime DLL missing" }
          Write-Output "Single VST3 bundle contains real original DOSBox-X-AWE32 DLL; no private Creative ROM/DEMO/SF2, no real playback proof"
      - name: Stage synthetic guest only
        shell: pwsh
        run: |
          if ((git rev-parse HEAD).Trim() -ne '0ff08116701efd831b9fca00970f8b059ae9b9af') { throw 'Product commit mismatch' }
          python tests/MakeSyntheticDemoExe.py --bundle 'build-vst3/VST3/Release/AWE64GoldDOSBoxDev.vst3'
          if ($LASTEXITCODE -ne 0) { throw 'Synthetic fixture staging failed' }
      - name: Checkout immutable independent Test Lab
        uses: actions/checkout@v4
        with:
          repository: challanger2000/125A-Plugin-Test-Lab
          ref: '7213fe1f81f4036f74431cb5b2d7dbd09b73ee5c'
          path: independent-lab
          persist-credentials: false
      - name: Build native independent hosts
        shell: pwsh
        run: |
          if ((git -C independent-lab rev-parse HEAD).Trim() -ne '7213fe1f81f4036f74431cb5b2d7dbd09b73ee5c') { throw 'Lab commit mismatch' }
          cmake -S independent-lab -B build-lab -G "Visual Studio 17 2022" -A x64
          if ($LASTEXITCODE -ne 0) { throw 'Lab configure failed' }
          cmake --build build-lab --config Release --target TestLabHost TestLabGUI TestLabStateStress --parallel 4
          if ($LASTEXITCODE -ne 0) { throw 'Lab host build failed' }
      - name: Run independent P74 ABI GUI and technical baseline
        shell: pwsh
        run: |
          $bundle=(Resolve-Path 'build-vst3/VST3/Release/AWE64GoldDOSBoxDev.vst3').Path
          $module=Join-Path $bundle 'Contents/x86_64-win/AWE64GoldDOSBoxDev.vst3'
          $runtime=Join-Path $bundle 'Contents/x86_64-win/AWE64DOSBoxRuntime.dll'
          $report=Join-Path $pwd 'independent-report'
          New-Item -ItemType Directory -Force $report | Out-Null
          $identity=@{product_commit='0ff08116701efd831b9fca00970f8b059ae9b9af';lab_commit='7213fe1f81f4036f74431cb5b2d7dbd09b73ee5c';module_sha256=(Get-FileHash $module).Hash.ToLowerInvariant();runtime_sha256=(Get-FileHash $runtime).Hash.ToLowerInvariant();assets='SYNTHETIC_ONLY';original_pcm='NOT RUN';release_approved=$false}
          $identity | ConvertTo-Json | Set-Content -Encoding utf8 (Join-Path $report 'SOURCE-IDENTITY.json')
          function Find-One([string]$name) {
            $items=@(Get-ChildItem build-lab -Recurse -File -Filter $name)
            if ($items.Count -ne 1) { throw "Expected exactly one $name" }
            return $items[0].FullName
          }
          $gui=Find-One '125A_Test_Lab_GUI.exe'
          $audio=Find-One '125A_Test_Lab_Host.exe'
          $stress=Find-One '125A_Test_Lab_State_Stress.exe'
          $env:SDL_AUDIODRIVER='dummy'
          python independent-lab/tests/run_universal_qa.py --plugin $bundle --gui-host $gui --audio-host $audio --stress-host $stress --run-technical-baseline --timeout 110 --out $report
          $rc=$LASTEXITCODE
          $result=Join-Path $report 'UNIVERSAL-QA-RESULT.json'
          if (Test-Path $result) { Get-Content $result -Raw | Write-Host }
          if ($identity.module_sha256 -ne (Get-FileHash $module).Hash.ToLowerInvariant() -or $identity.runtime_sha256 -ne (Get-FileHash $runtime).Hash.ToLowerInvariant()) { throw 'Plugin binary changed' }
          if ($rc -ne 0 -or -not (Test-Path $result)) { throw 'Independent Lab failed or incomplete; inspect evidence, no release claim' }
          $j=Get-Content $result -Raw | ConvertFrom-Json
          if ($j.status -ne 'TECHNICAL_BASELINE_PASS' -or $j.verified_module_sha256 -ne $identity.module_sha256 -or $j.release_approved -ne $false) { throw 'Independent Lab result identity or coverage mismatch' }
      - name: Retain independent synthetic-only QA reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AWE64-independent-test-lab-evidence
          path: |
            independent-report/**/*.json
            independent-report/**/*.log
            independent-report/**/*.tsv
          if-no-files-found: warn
          retention-days: 7
