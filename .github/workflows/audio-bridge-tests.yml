name: Audio bridge unit tests (not VST3)
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'gui/PresetCatalog.h'
      - '.gitignore'
      - 'tools/audit_private_paths.py'
      - 'tests/**'
      - 'integration/DosBoxHostAdapter.hpp'
      - 'integration/AWE64_DOSBOX_ABI.h'
      - 'tools/patch_creative_demo.py'
      - 'tools/prepare_private_vst3.py'
      - 'tools/test_private_vst3.py'
      - 'tools/Run-Private-Creative-AWE-Test.ps1'
      - 'tools/Build-And-Test-Private-AWE64.ps1'
      - 'guest/**'
      - 'CMakeLists.txt'
      - '.github/workflows/audio-bridge-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bridge:
    name: ${{ matrix.os }} / transport tests
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Validate original Creative guest patch without proprietary sources
        run: python -m unittest discover -s tests -p test_guest_patch.py
      - name: Verify private bundle staging using ONLY generated fake data
        run: python -m unittest discover -s tools -p test_private_vst3.py -v
      - name: Verify private Creative audio gate using ONLY generated fake data
        run: python -m unittest discover -s tests -p test_private_creative_guest.py -v
      - name: Probe private Creative-DOS startup error diagnosis with GENERATED children only
        run: python -m unittest discover -s tests -p test_private_boot_diagnostic.py -v
      - name: Verify local-only original-AWE64 Windows build script privacy contract
        run: python -m unittest discover -s tests -p test_private_build_runner.py -v
      - name: Parse private Windows PowerShell scripts without executing owner files
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($script in @('tools/Run-Private-Creative-AWE-Test.ps1','tools/Build-And-Test-Private-AWE64.ps1')) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $script).Path,[ref]$tokens,[ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) { throw ('PowerShell syntax errors in ' + $script + ': ' + ($parseErrors | Out-String)) }
          }
      - name: Verify original AWE32 hardware gate format WITHOUT proprietary files
        run: python -m unittest discover -s tests -p test_awe_hardware_probe.py -v
      - name: Verify DOS PC speaker PCM probe instructions without protected data
        run: python -m unittest discover -s tests -p test_speaker_probe.py -v
      - name: Verify independent DOS MZ EXE test fixture and no-owner-overwrite safeguards
        run: python -m unittest discover -s tests -p test_synthetic_dos_exe.py -v
      - name: Validate generated SF2 RIFF and RAM preset structure
        run: python -m unittest discover -s tests -p test_ram_sample_sf2.py -v
      - name: Verify synthetic one-byte Creative SysEx repair contract
        run: python -m unittest discover -s tests -p test_creative_sysex_fix.py -v
      - name: Configure
        run: cmake -S . -B build -DBUILD_TESTING=ON
      - name: Compile
        run: cmake --build build --config Release --parallel 2
      - name: Test (must execute checks in Release)
        run: ctest --test-dir build -C Release --output-on-failure
