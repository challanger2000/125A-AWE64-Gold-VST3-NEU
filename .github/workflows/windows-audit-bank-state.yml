name: Native audit - SF2 state fault injection (synthetic only)
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'gui/PresetCatalog.h'
      - 'tests/WindowsAuditBankState.cpp'
      - '.github/workflows/windows-audit-bank-state.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit-bank-state:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Build unchanged VST3 and isolated native audit host
        shell: pwsh
        run: |
          git clone --depth 1 --branch v3.7.12_build_20 --recurse-submodules --shallow-submodules https://github.com/steinbergmedia/vst3sdk.git "$env:RUNNER_TEMP\vst3sdk"
          if ($LASTEXITCODE -ne 0) { throw 'SDK acquisition failed' }
          # Reuse the exact existing SDK-linked host target in this disposable checkout only.
          # No production source or existing test is changed in the repository.
          Copy-Item tests/WindowsAuditBankState.cpp tests/WindowsVst3HostPcmSmoke.cpp -Force
          cmake -S . -B build-audit -G "Visual Studio 17 2022" -A x64 -DAWE64_BUILD_VST3_DEV=ON -DAWE64_VST3SDK="$env:RUNNER_TEMP\vst3sdk" -DBUILD_TESTING=OFF
          if ($LASTEXITCODE -ne 0) { throw 'CMake configure failed' }
          cmake --build build-audit --config Release --target AWE64GoldDOSBoxDev awe64_vst3_host_pcm_smoke --parallel 2
          if ($LASTEXITCODE -ne 0) { throw 'Audit build failed' }
      - name: Generate synthetic SF2 fixtures and run genuine VST3 state fault injection
        shell: pwsh
        timeout-minutes: 2
        run: |
          $fixtures=Join-Path $env:RUNNER_TEMP 'awe64-audit-fixtures'
          if (Test-Path $fixtures) { throw 'Fixture directory already exists' }
          @'
          import runpy, sys
          sys.argv=['tests/MakeAuditSf2Cases.py',sys.argv[1]]
          f=runpy.run_path(sys.argv[0])
          f['write']('program17',lambda l:f['mutate'](l[b'pdta'],b'phdr',20,'<H',17))
          f['write']('invalid_loop',lambda l:f['mutate'](l[b'pdta'],b'shdr',32,'<I',0xffffffff))
          '@ | Set-Content -Encoding utf8 "$env:RUNNER_TEMP\audit-fixtures.py"
          python "$env:RUNNER_TEMP\audit-fixtures.py" $fixtures
          if ($LASTEXITCODE -ne 0) { throw 'Fixture generation failed' }
          $plugin=(Resolve-Path 'build-audit/VST3/Release/AWE64GoldDOSBoxDev.vst3/Contents/x86_64-win/AWE64GoldDOSBoxDev.vst3').Path
          $testExe=(Get-ChildItem build-audit -Recurse -Filter awe64_vst3_host_pcm_smoke.exe | Select-Object -First 1).FullName
          if (-not $testExe) { throw 'Native audit test executable missing' }
          & $testExe $plugin (Join-Path $fixtures 'valid.sf2') (Join-Path $fixtures 'program17.sf2') (Join-Path $fixtures 'invalid_loop.sf2')
          $rc=$LASTEXITCODE
          if ($rc -ne 0) { throw "Native audit result exit=$rc (1=contract failure, 2=infra/controls)" }
