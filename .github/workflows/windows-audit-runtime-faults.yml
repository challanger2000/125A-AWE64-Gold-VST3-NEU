name: Native audit - runtime faults and host timing
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'gui/PresetCatalog.h'
      - 'tests/WindowsAuditRuntimeFaults.cpp'
      - '.github/workflows/windows-audit-runtime-faults.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: awe64-runtime-audit-${{ github.ref }}
  cancel-in-progress: false
jobs:
  compile-original-dosbox-dll:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: microsoft/setup-msbuild@v2
      - name: Confirm original DOSBox-X SHA
        shell: pwsh
        run: |
          $sha=(git -C third_party/dosbox-x-AWE32 rev-parse HEAD).Trim()
          if ($sha -ne 'f3a95b9f19a7f9863295e6481f271cf04733c635') { throw "Unexpected upstream SHA $sha" }
      - name: Patch only GitHub runner working tree
        shell: pwsh
        run: |
          python integration/patch_dosbox_runtime.py third_party/dosbox-x-AWE32
          if ($LASTEXITCODE -ne 0) { throw "Source patch failed" }
      - name: Check private Creative-only setup script PowerShell syntax without original files
        shell: pwsh
        run: |
          $t = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'tools/Run-Private-Creative-AWE-Test.ps1').Path,[ref]$t,[ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) { throw ('Private staging PowerShell syntax error: ' + ($parseErrors | Out-String)) }
      - name: Restore compiled OPEN-SOURCE DOSBox-X SDL2 DLL cache (NO owner ROM/SF2/Creative)
        id: original-dosbox-cache
        uses: actions/cache/restore@v4
        with:
          path: third_party/dosbox-x-AWE32/bin/x64/Release SDL2/AWE64DOSBoxRuntime.dll
          key: awe64-original-sdl2-msvc-2022-f3a95b9-${{ hashFiles('integration/patch_dosbox_runtime.py','research/p165-control-port/VoiceOverlay.hpp') }}
      - name: Build in-process x64 DOSBox-X-AWE32 DLL
        if: steps.original-dosbox-cache.outputs.cache-hit != 'true'
        shell: pwsh
        working-directory: third_party/dosbox-x-AWE32
        run: |
          msbuild vs/dosbox-x.sln -t:dosbox-x:Rebuild '-p:Configuration=Release SDL2' -p:Platform=x64 -p:PostBuildEventUseInBuild=false -m:4
          if ($LASTEXITCODE -ne 0) { throw "DOSBox runtime DLL compilation failed" }
          if (-not (Test-Path 'bin/x64/Release SDL2/AWE64DOSBoxRuntime.dll')) { throw "Runtime DLL not found" }
      - name: Save compiled OPEN-SOURCE DOSBox-X SDL2 DLL after successful build
        if: steps.original-dosbox-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: third_party/dosbox-x-AWE32/bin/x64/Release SDL2/AWE64DOSBoxRuntime.dll
          key: awe64-original-sdl2-msvc-2022-f3a95b9-${{ hashFiles('integration/patch_dosbox_runtime.py','research/p165-control-port/VoiceOverlay.hpp') }}
      - name: Compile VST3 host and stage original internal DOSBox-X runtime DLL
        shell: pwsh
        run: |
          git clone --depth 1 --branch v3.7.12_build_20 --recurse-submodules --shallow-submodules https://github.com/steinbergmedia/vst3sdk.git "$env:RUNNER_TEMP\vst3sdk"
          if ($LASTEXITCODE -ne 0) { throw "VST3 SDK acquisition failed" }
          Copy-Item tests/WindowsAuditRuntimeFaults.cpp tests/WindowsVst3HostPcmSmoke.cpp -Force
          cmake -S . -B build-vst3 -G "Visual Studio 17 2022" -A x64 -DAWE64_BUILD_VST3_DEV=ON -DAWE64_VST3SDK="$env:RUNNER_TEMP\vst3sdk" -DBUILD_TESTING=OFF
          if ($LASTEXITCODE -ne 0) { throw "VST3 configuration failed" }
          cmake --build build-vst3 --config Release --target AWE64GoldDOSBoxDev awe64_vst3_host_pcm_smoke --parallel 2
          if ($LASTEXITCODE -ne 0) { throw "VST3 Windows build failed" }
          $bundle='build-vst3/VST3/Release/AWE64GoldDOSBoxDev.vst3/Contents/x86_64-win'
          $native='third_party/dosbox-x-AWE32/bin/x64/Release SDL2/AWE64DOSBoxRuntime.dll'
          if (-not (Test-Path $native)) { throw "Original DOSBox DLL not built" }
          if (-not (Test-Path (Join-Path $bundle 'AWE64GoldDOSBoxDev.vst3'))) { throw "VST3 host binary missing" }
          Copy-Item $native (Join-Path $bundle 'AWE64DOSBoxRuntime.dll')
          if (-not (Test-Path (Join-Path $bundle 'AWE64DOSBoxRuntime.dll'))) { throw "In-bundle runtime DLL missing" }
          Write-Output "Single VST3 bundle contains real original DOSBox-X-AWE32 DLL; no private Creative ROM/DEMO/SF2, no real playback proof"
      - name: Execute isolated native fault cases independently
        shell: pwsh
        timeout-minutes: 5
        run: |
          python tests/MakeSyntheticDemoExe.py --bundle 'build-vst3/VST3/Release/AWE64GoldDOSBoxDev.vst3'
          if ($LASTEXITCODE -ne 0) { throw 'Fixture staging failed' }
          python tests/MakeAuditSf2Cases.py "$env:RUNNER_TEMP\audit-banks"
          if ($LASTEXITCODE -ne 0) { throw 'SF2 fixture generation failed' }
          $plugin=(Resolve-Path 'build-vst3/VST3/Release/AWE64GoldDOSBoxDev.vst3/Contents/x86_64-win/AWE64GoldDOSBoxDev.vst3').Path
          $exe=(Get-ChildItem build-vst3 -Recurse -Filter awe64_vst3_host_pcm_smoke.exe | Select-Object -First 1).FullName
          if (-not $exe) { throw 'Native host missing' }
          $env:AWE64_TEST_PERFORMANCE='1'
          $env:SDL_AUDIODRIVER='dummy'
          Remove-Item Env:AWE64_TEST_HOST_DEMAND_CLOCK -ErrorAction SilentlyContinue
          @'
          import re,subprocess,sys
          exe,plugin,bank=sys.argv[1:]
          failed=[]
          switch_control=False
          for mode in ('early','pause','automation','switch','rollback'):
              print('AUDIT_CASE_BEGIN',mode,flush=True)
              try:
                  p=subprocess.run([exe,plugin,mode,bank],capture_output=True,text=True,errors='replace',timeout=40)
              except subprocess.TimeoutExpired as e:
                  print('AUDIT_CASE_TIMEOUT',mode,e.stdout,e.stderr,flush=True)
                  failed.append(mode);continue
              print(p.stdout,flush=True);print(p.stderr,flush=True)
              marker='AUDIT_NATIVE_RUNTIME_EXECUTED mode='+mode+' failures='
              if p.returncode or p.stdout.count(marker)!=1:failed.append(mode)
              if mode=='switch':switch_control=p.returncode==0 and 'AUDIT_ACTIVE_BANK_SWITCH_CONTROL PASS' in p.stdout
              if mode=='rollback' and not switch_control:
                  print('AUDIT_A06_ACTIVE_ROLLBACK NOT_VERIFIED positive switch control failed');failed.append(mode)
              if mode=='pause':
                  counters=re.findall(r'PERF_QUEUE_BLOCKS=(\d+) AUDIO_DROPPED_FRAMES=(\d+) MIDI_DROPPED_EVENTS=(\d+) UNDERRUN_FRAMES=(\d+)',p.stdout)
                  if len(counters)!=1 or int(counters[0][0])==0:
                      print('AUDIT_A04_PAUSE NOT_VERIFIED missing counters');failed.append(mode)
                  else:
                      drops=int(counters[0][1]); print('AUDIT_A04_PAUSE', 'PASS' if drops==0 else 'FAIL', 'audio_drops='+str(drops))
                      if drops:failed.append(mode)
          print('AUDIT_RUNTIME_CASES_FAILED',failed,flush=True)
          sys.exit(bool(failed))
          '@ | Set-Content -Encoding utf8 "$env:RUNNER_TEMP\runtime-audit.py"
          python "$env:RUNNER_TEMP\runtime-audit.py" $exe $plugin "$env:RUNNER_TEMP\audit-banks\valid.sf2"
          if ($LASTEXITCODE -ne 0) { throw 'Native runtime audit: at least one case failed or not verified' }
