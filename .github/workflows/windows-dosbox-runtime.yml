name: DOSBox-X original + VST3 MIDI/PCM end-to-end (synthetic DOS)
on:
  push:
    branches: [main]
    paths:
      - 'integration/**'
      - 'research/p165-control-port/**'
      - 'tests/test_dosbox_runtime_patch.py'
      - 'tests/DosBoxHostAdapterTest.cpp'
      - 'tests/WindowsDosBoxGuestSmoke.py'
      - 'tests/MakeMpuCom.py'
      - 'tests/WindowsMpuGuestSmoke.py'
      - 'tests/WindowsAweHardwareSmoke.py'
      - 'tests/MakeSpeakerCom.py'
      - 'tests/WindowsSpeakerPcmSmoke.py'
      - 'tests/MakeSyntheticDemoExe.py'
      - 'tests/MakeMidiTriggeredDemoExe.py'
      - 'tests/WindowsVst3HostPcmSmoke.cpp'
      - 'tests/CreativeMidiBankSelectTest.cpp'
      - 'tests/WindowsRunVst3HostPcmSmoke.py'
      - 'tests/test_voice_overlay_report.py'
      - 'tests/WindowsPrivateCreativeGuestSmoke.py'
      - 'tests/WindowsCheezoidsSweep.py'
      - 'tests/MakeRamSampleSf2.py'
      - 'tests/test_ram_sample_sf2.py'
      - 'tools/Run-Private-Creative-AWE-Test.ps1'
      - 'tests/WindowsVst3CreativeOnlyNegative.py'
      - 'tests/test_synthetic_dos_exe.py'
      - 'tests/test_speaker_probe.py'
      - 'tests/test_awe_hardware_probe.py'
      - 'tests/test_mpu_probe.py'
      - 'tools/Run-Prebuilt-Private-Test.cmd'
      - 'src/**'
      - 'gui/**'
      - 'CMakeLists.txt'
      - '.github/workflows/windows-dosbox-runtime.yml'
      - '.github/workflows/windows-vst3-dev-shell.yml'
  workflow_dispatch:
concurrency:
  group: awe64-dosbox-runtime-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
jobs:
  patch-actual-upstream:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Verify upstream commit and apply real source patch
        run: |
          test "$(git -C third_party/dosbox-x-AWE32 rev-parse HEAD)" = "f3a95b9f19a7f9863295e6481f271cf04733c635"
          c++ -std=c++14 -Wall -Wextra -Werror -O2 research/p165-control-port/VoiceOverlayTest.cpp -o /tmp/awe64-overlay-math
          /tmp/awe64-overlay-math
          python -m unittest discover -s tests -p test_dosbox_runtime_patch.py -v
          PYTHONPATH=tests python -m unittest discover -s tests -p test_mpu_probe.py -v
          PYTHONPATH=tests python -m unittest discover -s tests -p test_ram_sample_sf2.py -v
          PYTHONPATH=tests python -m unittest discover -s tests -p test_voice_overlay_report.py -v
          python integration/patch_dosbox_runtime.py third_party/dosbox-x-AWE32
          grep -q 'AweHostRead.Install(0xBEE0u' third_party/dosbox-x-AWE32/src/hardware/emu8000.cpp
          grep -q 'AWE64_HostRegisterPCM' third_party/dosbox-x-AWE32/src/hardware/mixer.cpp
  compile-original-dosbox-dll:
    needs: patch-actual-upstream
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: microsoft/setup-msbuild@v2
      - name: Confirm original DOSBox-X SHA
        shell: pwsh
        run: |
          $sha=(git -C third_party/dosbox-x-AWE32 rev-parse HEAD).Trim()
          if ($sha -ne 'f3a95b9f19a7f9863295e6481f271cf04733c635') { throw "Unexpected upstream SHA $sha" }
      - name: Patch only GitHub runner working tree
        shell: pwsh
        run: |
          python integration/patch_dosbox_runtime.py third_party/dosbox-x-AWE32
          if ($LASTEXITCODE -ne 0) { throw "Source patch failed" }
      - name: Check private Creative-only setup script PowerShell syntax without original files
        shell: pwsh
        run: |
          $t = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'tools/Run-Private-Creative-AWE-Test.ps1').Path,[ref]$t,[ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) { throw ('Private staging PowerShell syntax error: ' + ($parseErrors | Out-String)) }
      - name: Restore compiled OPEN-SOURCE DOSBox-X SDL2 DLL cache (NO owner ROM/SF2/Creative)
        id: original-dosbox-cache
        uses: actions/cache/restore@v4
        with:
          path: third_party/dosbox-x-AWE32/bin/x64/Release SDL2/AWE64DOSBoxRuntime.dll
          key: awe64-original-sdl2-msvc-2022-f3a95b9-${{ hashFiles('integration/patch_dosbox_runtime.py','research/p165-control-port/VoiceOverlay.hpp') }}
      - name: Build in-process x64 DOSBox-X-AWE32 DLL
        if: steps.original-dosbox-cache.outputs.cache-hit != 'true'
        shell: pwsh
        working-directory: third_party/dosbox-x-AWE32
        run: |
          msbuild vs/dosbox-x.sln -t:dosbox-x:Rebuild '-p:Configuration=Release SDL2' -p:Platform=x64 -p:PostBuildEventUseInBuild=false -m:4
          if ($LASTEXITCODE -ne 0) { throw "DOSBox runtime DLL compilation failed" }
          if (-not (Test-Path 'bin/x64/Release SDL2/AWE64DOSBoxRuntime.dll')) { throw "Runtime DLL not found" }
      - name: Save compiled OPEN-SOURCE DOSBox-X SDL2 DLL after successful build
        if: steps.original-dosbox-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: third_party/dosbox-x-AWE32/bin/x64/Release SDL2/AWE64DOSBoxRuntime.dll
          key: awe64-original-sdl2-msvc-2022-f3a95b9-${{ hashFiles('integration/patch_dosbox_runtime.py','research/p165-control-port/VoiceOverlay.hpp') }}
      - name: Assert real DLL exports exist
        shell: pwsh
        run: |
          $dll=Join-Path $pwd 'third_party/dosbox-x-AWE32/bin/x64/Release SDL2/AWE64DOSBoxRuntime.dll'
          $tool=Get-ChildItem 'C:\Program Files\Microsoft Visual Studio\2022' -Filter dumpbin.exe -Recurse -ErrorAction SilentlyContinue | Where-Object { $_.FullName -match 'Hostx64\\x64' } | Select-Object -First 1
          if (-not $tool) { throw 'dumpbin.exe not found' }
          # Actual internal-DLL codepath must use the SDL2 project variant
          if (-not (Test-Path $dll)) { throw "Original SDL2-DLL is absent" }
          $exports=(& $tool.FullName /exports $dll | Out-String)
          foreach ($symbol in @('AWE64_StartGuest','AWE64_HostRegisterIO','AWE64_HostRegisterPCM')) {
            if (-not $exports.Contains($symbol)) { throw "Missing native runtime export $symbol" }
          }
          Write-Host 'Compiled original DOSBox-X-AWE32 DLL; no Creative DOS guest boot or PCM proved'
      - name: Load actual original DOSBox-X DLL in the same Windows process
        shell: pwsh
        run: |
          @'
          import ctypes,os,pathlib
          path=pathlib.Path('third_party/dosbox-x-AWE32/bin/x64/Release SDL2/AWE64DOSBoxRuntime.dll').resolve()
          with os.add_dll_directory(str(path.parent)):
              dll=ctypes.WinDLL(str(path))
              names=('AWE64_StartGuest','AWE64_HostRegisterIO','AWE64_HostRegisterPCM','AWE64_HostRegisterMidi','AWE64_RequestStop','AWE64_IsInternalAudioOnly')
              for name in names: assert getattr(dll,name,None) is not None, name
              dll.AWE64_HostRegisterMidi.argtypes=(ctypes.c_void_p,ctypes.c_void_p)
              dll.AWE64_HostRegisterMidi.restype=None
              dll.AWE64_HostRegisterMidi(None,None)
          print('Real Windows DLL loaded and MPU-401 host callback export callable; no DOS guest started')
          '@ | python -
      - name: Smoke real DOSBox-X main() and clean return within same Windows process
        shell: pwsh
        run: |
          $dll=Join-Path $pwd 'third_party/dosbox-x-AWE32/bin/x64/Release SDL2/AWE64DOSBoxRuntime.dll'
          python tests/WindowsDosBoxGuestSmoke.py --parent $dll
          if ($LASTEXITCODE -ne 0) { throw "Original DOSBox-X in-process bootstrap/exit failed" }
      - name: Verify original DOSBox-X background worker receives stop and joins
        shell: pwsh
        run: |
          $dll=Join-Path $pwd 'third_party/dosbox-x-AWE32/bin/x64/Release SDL2/AWE64DOSBoxRuntime.dll'
          python tests/WindowsDosBoxGuestSmoke.py --stop-parent $dll
          if ($LASTEXITCODE -ne 0) { throw "Real DOSBox in-process worker shutdown did not complete" }
      - name: Prove original AWE32 EMU8000 registers receive real AWEUTIL DOS writes
        shell: pwsh
        run: |
          $dll=Join-Path $pwd 'third_party/dosbox-x-AWE32/bin/x64/Release SDL2/AWE64DOSBoxRuntime.dll'
          python tests/WindowsAweHardwareSmoke.py --parent $dll
          if ($LASTEXITCODE -ne 0) { throw "Original AWE32 EMU8000 hardware register smoke FAILED" }
      - name: Prove non-silent PCM from real DOS PC-speaker hardware through ORIGINAL DOSBox-X mixer
        shell: pwsh
        run: |
          $dll=Join-Path $pwd 'third_party/dosbox-x-AWE32/bin/x64/Release SDL2/AWE64DOSBoxRuntime.dll'
          python tests/WindowsSpeakerPcmSmoke.py --parent $dll
          if ($LASTEXITCODE -ne 0) { throw "Original DOS hardware speaker PCM callback test FAILED" }
      - name: Prove actual 16-bit guest MPU401 UART receives host MIDI through original DOSBox-X
        shell: pwsh
        run: |
          $dll=Join-Path $pwd 'third_party/dosbox-x-AWE32/bin/x64/Release SDL2/AWE64DOSBoxRuntime.dll'
          python tests/WindowsMpuGuestSmoke.py --parent $dll
          if ($LASTEXITCODE -ne 0) { throw "Original MPU401 guest hardware path failed" }
      - name: Compile VST3 host and stage original internal DOSBox-X runtime DLL
        shell: pwsh
        run: |
          git clone --depth 1 --branch v3.7.12_build_20 --recurse-submodules --shallow-submodules https://github.com/steinbergmedia/vst3sdk.git "$env:RUNNER_TEMP\vst3sdk"
          if ($LASTEXITCODE -ne 0) { throw "VST3 SDK acquisition failed" }
          cmake -S . -B build-vst3 -G "Visual Studio 17 2022" -A x64 -DAWE64_BUILD_VST3_DEV=ON -DAWE64_VST3SDK="$env:RUNNER_TEMP\vst3sdk" -DBUILD_TESTING=OFF
          if ($LASTEXITCODE -ne 0) { throw "VST3 configuration failed" }
          cmake --build build-vst3 --config Release --target AWE64GoldDOSBoxDev awe64_vst3_host_pcm_smoke --parallel 2
          if ($LASTEXITCODE -ne 0) { throw "VST3 Windows build failed" }
          $bundle='build-vst3/VST3/Release/AWE64GoldDOSBoxDev.vst3/Contents/x86_64-win'
          $native='third_party/dosbox-x-AWE32/bin/x64/Release SDL2/AWE64DOSBoxRuntime.dll'
          if (-not (Test-Path $native)) { throw "Original DOSBox DLL not built" }
          if (-not (Test-Path (Join-Path $bundle 'AWE64GoldDOSBoxDev.vst3'))) { throw "VST3 host binary missing" }
          Copy-Item $native (Join-Path $bundle 'AWE64DOSBoxRuntime.dll')
          if (-not (Test-Path (Join-Path $bundle 'AWE64DOSBoxRuntime.dll'))) { throw "In-bundle runtime DLL missing" }
          Write-Output "Single VST3 bundle contains real original DOSBox-X-AWE32 DLL; no private Creative ROM/DEMO/SF2, no real playback proof"
      - name: Prepare asset-free developer test bundle BEFORE synthetic DOS staging
        shell: pwsh
        run: |
          $source='build-vst3/VST3/Release/AWE64GoldDOSBoxDev.vst3'
          $stage=Join-Path $env:RUNNER_TEMP 'AWE64-private-test-preparation'
          New-Item -ItemType Directory -Path $stage -ErrorAction Stop | Out-Null
          if (Test-Path (Join-Path $source 'Contents/Resources/PRIVATE')) { throw 'Unexpected private or synthetic assets in clean bundle' }
          Copy-Item -LiteralPath $source -Destination $stage -Recurse -ErrorAction Stop
          New-Item -ItemType Directory -Path (Join-Path $stage 'tools'),(Join-Path $stage 'tests') -ErrorAction Stop | Out-Null
          Copy-Item -LiteralPath 'build-vst3/Release/awe64_vst3_host_pcm_smoke.exe' -Destination $stage -ErrorAction Stop
          Copy-Item -LiteralPath 'tools/Run-Private-Creative-AWE-Test.ps1' -Destination (Join-Path $stage 'tools') -ErrorAction Stop
          Copy-Item -LiteralPath 'tests/WindowsRunVst3HostPcmSmoke.py','tests/WindowsPrivateCreativeGuestSmoke.py','tests/MakeRamSampleSf2.py','tests/WindowsCheezoidsSweep.py' -Destination (Join-Path $stage 'tests') -ErrorAction Stop
          Copy-Item -LiteralPath 'third_party/dosbox-x-AWE32/COPYING' -Destination (Join-Path $stage 'DOSBox-X-COPYING.txt') -ErrorAction Stop
          Copy-Item -LiteralPath 'docs/PROVENANCE.md' -Destination $stage -ErrorAction Stop
          Copy-Item -LiteralPath 'tools/Run-Prebuilt-Private-Test.cmd' -Destination $stage -ErrorAction Stop
          $forbidden=Get-ChildItem $stage -Recurse -Force | Where-Object { $_.Name -eq 'PRIVATE' -or $_.Name -eq 'DEMO.EXE' -or $_.Extension -in @('.raw','.sf2','.sbk') }
          if ($forbidden) { throw 'Asset-free package check failed' }
          Set-Content -LiteralPath (Join-Path $stage 'BUILD-COMMIT.txt') -Value $env:GITHUB_SHA
          Write-Host 'Prepared original-free development test bundle; no original Creative bytes and no release.'
      - name: Verify REAL VST3 MIDI NoteOn -> original DOS MPU-401 -> PC speaker -> VST3 PCM
        shell: pwsh
        timeout-minutes: 2
        run: |
          $bundle='build-vst3/VST3/Release/AWE64GoldDOSBoxDev.vst3'
          $plugin=Join-Path $bundle 'Contents/x86_64-win/AWE64GoldDOSBoxDev.vst3'
          $hostTestExe='build-vst3/Release/awe64_vst3_host_pcm_smoke.exe'
          python tests/MakeSyntheticDemoExe.py --bundle $bundle
          if ($LASTEXITCODE -ne 0) { throw 'Safe synthetic test DOS EXE staging failed' }
          python tests/WindowsRunVst3HostPcmSmoke.py --exe $hostTestExe --plugin $plugin
          if ($LASTEXITCODE -ne 0) { throw 'VST3 process() failed to deliver original mixer audio' }
      - name: NEGATIVE CONTROL real VST3 must silence PC-speaker+OPL in private-Creative-only mode
        shell: pwsh
        timeout-minutes: 2
        run: |
          $bundle='build-vst3/VST3/Release/AWE64GoldDOSBoxDev.vst3'
          $plugin=Join-Path $bundle 'Contents/x86_64-win/AWE64GoldDOSBoxDev.vst3'
          $hostTestExe='build-vst3/Release/awe64_vst3_host_pcm_smoke.exe'
          # This must run on exactly the SYNTHETIC ROM and DOS MZ fixture
          # from the previous POSITIVE control, NOT authentic Creative files.
          # Real Windows VST3 must respond with silence and no fake PASS.
          python tests/WindowsVst3CreativeOnlyNegative.py --exe $hostTestExe --plugin $plugin
          if ($LASTEXITCODE -ne 0) { throw 'Private-only original-Creative anti-spoof negative control FAILED' }
      - name: Full pinned Steinberg SDK validator (synthetic assets, no Creative data)
        shell: pwsh
        timeout-minutes: 8
        run: |
          cmake --build build-vst3 --config Release --target validator --parallel 2
          if ($LASTEXITCODE -ne 0) { throw 'Official Steinberg validator build failed' }
          $validators=@(Get-ChildItem -LiteralPath 'build-vst3' -Filter 'validator.exe' -Recurse -File)
          if ($validators.Count -ne 1) { throw 'Missing or ambiguous official SDK validator binary' }
          $bundle=(Resolve-Path 'build-vst3/VST3/Release/AWE64GoldDOSBoxDev.vst3').Path
          $env:SDL_AUDIODRIVER='dummy'
          $summary=@()
          & $validators[0].FullName $bundle 2>&1 | ForEach-Object {
              Write-Host $_
              if ("$_" -match '^Result: [1-9][0-9]* tests passed, 0 tests failed$') { $summary += "$_" }
          }
          $code=$LASTEXITCODE
          if ($code -ne 0 -or $summary.Count -ne 1) { throw "Full SDK validator failed; exit=$code" }
      - name: Verify actual P165 editor lifecycle and MOD RESET click in independent Win32 host
        shell: pwsh
        timeout-minutes: 2
        run: |
          $plugin=(Resolve-Path 'build-vst3/VST3/Release/AWE64GoldDOSBoxDev.vst3/Contents/x86_64-win/AWE64GoldDOSBoxDev.vst3').Path
          $hostTestExe=(Resolve-Path 'build-vst3/Release/awe64_vst3_host_pcm_smoke.exe').Path
          $log = & $hostTestExe $plugin --editor 2>&1
          $code=$LASTEXITCODE
          $log | ForEach-Object { Write-Host $_ }
          $reset = @($log | Where-Object { "$_" -match '^REAL_VST3_MOD_RESET_CLICK_PASS; PARAMS=12; GESTURES=12; PRESERVED=5; PASS=[01]
 })
          if ($code -ne 0 -or $reset.Count -ne 2 -or ($reset | Select-Object -Unique).Count -ne 2) { throw "Native editor/MOD RESET gate FAILED; exit=$code" }
      - name: Original Creative archival-reference research in actual Windows VST3 (no private owner files)
        shell: pwsh
        timeout-minutes: 28
        env:
          AWE64_TEST_CHEEZOIDS: '1'
        run: |
          # P30 research method: independently obtain already-public archival
          # reference inputs in ephemeral runner storage. Never upload bytes,
          # PCM, traces, logs or a bundle containing them. No owner files.
          $stage=Join-Path $env:RUNNER_TEMP 'AWE64-private-test-preparation'
          $research=Join-Path $env:RUNNER_TEMP 'AWE64-archival-reference'
          New-Item -ItemType Directory -Path $research -ErrorAction Stop | Out-Null
          try {
            # Use a disposable COPY; the clean development bundle stays clean.
            Copy-Item -LiteralPath (Join-Path $stage 'AWE64GoldDOSBoxDev.vst3') -Destination $research -Recurse -ErrorAction Stop
            $rom=Join-Path $research 'awe32.raw'
            Invoke-WebRequest -Uri 'https://raw.githubusercontent.com/libretro/libretro-pcem/e07923e902dcedcf65a502fb3f14e75b9ded5271/awe32.raw' -OutFile $rom
            $expected='4e143b94f758734f594ded78f4e5115635975c16fa37fabeae0baa4938ca710e'
            if ((Get-Item $rom).Length -ne 1048576 -or (Get-FileHash -Algorithm SHA256 -LiteralPath $rom).Hash.ToLowerInvariant() -ne $expected) { throw 'Public archival ROM does not match verified reference; no substitute' }
            $bundle=Join-Path $research 'AWE64GoldDOSBoxDev.vst3'
            $hostTestExe=Join-Path $stage 'awe64_vst3_host_pcm_smoke.exe'
            # Reuse the existing gate without changing its hashes or thresholds.
            & powershell.exe -NoProfile -NonInteractive -File (Join-Path $stage 'tools/Run-Private-Creative-AWE-Test.ps1') -Bundle $bundle -Rom $rom -HostExe $hostTestExe -Seconds 60
            if ($LASTEXITCODE -ne 0) { throw 'Authentic archival Creative/VST3 research gate FAILED' }
            Write-Host 'ARCHIVAL_REFERENCE_CREATIVE_VST3_RESEARCH_PASS; NOT_OWNER_DAW_OR_RELEASE'
          } finally {
            Remove-Item -LiteralPath $research -Recurse -Force -ErrorAction SilentlyContinue
          }
      # The source repo is public. Never publish the developer binaries until
      # distribution permissions are cleared. A private-repo runner can
      # deliver the prebuilt asset-free package after BOTH existing gates.
      - name: Upload prebuilt developer-only test package (private repositories only)
        if: ${{ github.event.repository.private == true }}
        uses: actions/upload-artifact@v4
        with:
          name: AWE64-private-test-preparation-${{ github.sha }}
          path: ${{ runner.temp }}/AWE64-private-test-preparation
          if-no-files-found: error
          retention-days: 3
      # No public release artifact or private ROM/SF2/Creative bytes uploaded.
