name: Restore exact approved P165 faceplate once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  restore-p165-faceplate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Restore and verify original P165 image
        shell: bash
        env:
          SOURCE_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          target="gui/resource/125A_P165_Original_Faceplate_1000x708.png"
          expected="7e57ef8e0c90d84fa4c951bea7815b0233762ca7"
          mkdir -p gui/resource
          if [ ! -f "$target" ]; then
            curl --fail --location --retry 3 --silent --show-error \
              "https://raw.githubusercontent.com/${SOURCE_OWNER}/125A-AWE-Synthesizer/8e8315c2ecab9f4a8bdbd415c1b7af5a8485a3c1/src/vst3/resource/125A_P165_Original_Faceplate_1000x708.png" \
              --output "$target"
          fi
          actual="$(git hash-object "$target")"
          if [ "$actual" != "$expected" ]; then
            echo "Original P165 faceplate SHA mismatch. Expected $expected got $actual" >&2
            exit 1
          fi
          if ! git diff --quiet -- "$target" || [ -n "$(git ls-files --others --exclude-standard -- "$target")" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- "$target"
            git commit -m "Sichere originales P165-Faceplate-Bild byteidentisch"
            git push origin HEAD:main
          fi
